name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Arrange files
        run: |
          mkdir -p app/src/main/java/com/stock/ledger app/src/main/assets app/src/main/res/values
          mv app_build.gradle app/build.gradle
          mv AndroidManifest.xml app/src/main/AndroidManifest.xml
          mv MainActivity.java app/src/main/java/com/stock/ledger/MainActivity.java
          mv strings.xml app/src/main/res/values/strings.xml
          mv index.html app/src/main/assets/index.html
          echo "pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }" > settings.gradle
          echo "dependencyResolutionManagement { repositories { google(); mavenCentral() } }" >> settings.gradle
          echo 'rootProject.name = "StockApp"' >> settings.gradle
          echo "include ':app'" >> settings.gradle
          echo "plugins { id 'com.android.application' version '8.5.2' apply false }" > build.gradle
          echo "org.gradle.jvmargs=-Xmx2g" > gradle.properties
          echo "android.useAndroidX=false" >> gradle.properties
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: StockApp-apk
          path: app/build/outputs/apk/debug/app-debug.apk
